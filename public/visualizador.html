<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="/sessao-papel.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar Documento</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #525659;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      display: block;
    }
    .aviso {
      color: #ffffff;
      padding: 30px;
      text-align: center;
    }
  </style>
</head>
<body>
  <iframe id="frame" title="Documento PDF"></iframe>

  <script>
    // Abre o PDF dentro de um <iframe> em vez de navegar direto para o arquivo.
    // Isso garante que o navegador mostre o visualizador de PDF embutido
    // primeiro (com botões próprios de zoom/baixar/imprimir), em vez de
    // disparar o download automaticamente - o que acontece em alguns
    // navegadores/configurações quando se navega direto para um arquivo PDF.
    const params = new URLSearchParams(window.location.search);
    const arquivo = params.get('arquivo') || '';

    // Só aceita caminhos dentro de uploads/, com nome de arquivo seguro (sem
    // navegação de diretório nem URLs externas/absolutas).
    const caminhoValido = /^uploads\/[\w.-]+\.pdf$/i.test(arquivo);

    function mostrarAviso(texto) {
      document.body.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'aviso';
      p.textContent = texto;
      document.body.appendChild(p);
    }

    // Os documentos são privados: o servidor só entrega o PDF por uma URL
    // assinada e de curta duração, emitida a quem está logado e tem acesso.
    async function abrir() {
      if (!caminhoValido) { mostrarAviso('Não foi possível carregar este documento.'); return; }
      let token = null;
      try { token = localStorage.getItem('onboarding_token'); } catch (e) { /* storage indisponível */ }
      if (!token) { mostrarAviso('Entre no sistema para visualizar este documento.'); return; }

      try {
        const r = await fetch('/api/arquivos/assinar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ arquivo })
        });
        const corpo = await r.json().catch(() => ({}));
        if (!r.ok || !corpo.url) {
          mostrarAviso(r.status === 403 ? 'Você não tem acesso a este documento.' : 'Não foi possível carregar este documento.');
          return;
        }
        document.getElementById('frame').src = corpo.url;
        document.title = arquivo.split('/').pop() + ' - Visualizar Documento';
      } catch (e) {
        mostrarAviso('Não foi possível carregar este documento.');
      }
    }
    abrir();
  </script>
</body>
</html>
