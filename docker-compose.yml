services:
  admitte:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    # Credenciais (Supabase, Google, API Key) vêm do .env da raiz do projeto,
    # sem serem copiadas para dentro da imagem (ver .dockerignore).
    env_file:
      - .env
    environment:
      - PORT=3001
    volumes:
      - ./uploads:/app/uploads
